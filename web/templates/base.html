<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>次世代開発 = Counter Viewer =</title>
    <style>
        /* 簡単な2カラムレイアウトのCSS */
        body { 
            display: flex; margin: 0; min-height: 100vh; font-family: sans-serif; 
            font-family: "BIZ UDPMincho", "MS PMincho", "Yu Mincho", YuMincho, serif;
        }
         
        /* 左側のサイドバー */
        .sidebar {
            width: 150px;
            flex-shrink: 0;
            /* background-color: #333; */
            background: linear-gradient(-225deg, #2CD8D5 0%, #C5C1FF 56%, #FFBAC3 100%);
            color: white;
            padding: 20px;
        }
        .sidebar a { display: block; color: white; margin-bottom: 10px; text-decoration: none; }
        .sidebar a:hover { color: #ffdd00; }

        /* 右側のメインコンテンツ */
        .main-content {
            flex-grow: 1;
            padding: 0px;
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Distance Viewer</h2>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('counter') }}">Distance</a>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
