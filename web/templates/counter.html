{% extends "base.html" %}

{% block content %}
    <div style="padding:20px;">
        <h2>Counter</h2>

        <div style="font-size: 2em;">レーン：1</div>
        <div id="cntdisp-1" style="text-align: center; font-size: 13em; margin-bottom: 10px;border:1px solid #000;">---</div>
        <div style="text-align: center;">
            <button onclick="ResetCounter(1)" style="font-size: 1.5em; padding: 10px 20px;">Reset</button>
            <button onclick="CounterUpdate(1)" style="font-size: 1.5em; padding: 10px 20px;">Update</button>
        </div>

        <div style="font-size: 2em;">レーン：2</div>
        <div id="cntdisp-2" style="text-align: center; font-size: 13em; margin-bottom: 10px;border:1px solid #000;">---</div>
        <div style="text-align: center;">
            <button onclick="ResetCounter(2)" style="font-size: 1.5em; padding: 10px 20px;">Reset</button>
            <button onclick="CounterUpdate(2)" style="font-size: 1.5em; padding: 10px 20px;">Update</button>
        </div>

    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>

        //------------------------------
        // WebSocket関連
        //------------------------------

        //　リセット用のWebSocket接続を確立
        const WebSocketObj = new WebSocket("{{ SERVER_WS_URL }}");
        WebSocketObj.onopen = () => {
            console.log('Reset用のWebSocket接続が確立されました。');
            //カウントの初期表示
            CounterUpdate(1);
            CounterUpdate(2);
        };

        // WebSocketの受信設定
        WebSocketObj.onmessage = (event) => {
            try {
                // 1. 受信したデータ（文字列）をオブジェクトに変換
                const data = JSON.parse(event.data);

                // 2. メッセージの種類（type）を確認
                if (data.type === 'counter') {
                    const counterValue = data.value;
                    const no = data.no; 
                    let setNo = "";
                    if(no === 1){
                        setNo = "1";
                    }else if(no === 2){
                        setNo = "2";
                    }
                    
                    // 3. 画面上の要素に反映（例: id="cntdisp-1" の要素を書き換える場合）
                    console.log(`カウンター更新: 'No': ${no}, 'Value': ${counterValue}`);
                    const displayElement = document.getElementById(`cntdisp-${setNo}`);
                    if (displayElement) {
                        displayElement.innerText = counterValue;
                    }
                }
            } catch (error) {
                console.error('JSON解析エラー:', error);
            }
        };

        //------------------------------
        // サーバにWebSocketで画面のカウントを更新する
        //------------------------------
        function CounterUpdate(No) {
            if (WebSocketObj.readyState === WebSocket.OPEN) {
                const data = { type: "update_counter", no: No };
                WebSocketObj.send(JSON.stringify(data));
                console.log("更新コマンドを送信しました。");
            } else {
                console.error("Update用のWebSocket接続が開いていません。");
            }
        }

        //------------------------------
        // カウンターをリセットする関数
        //------------------------------
        function ResetCounter(No) {
            if(confirm("カウンターをリセットしてもよろしいですか？")){
                if (WebSocketObj.readyState === WebSocket.OPEN) {
                    const data = { type: "reset", no: No };
                    WebSocketObj.send(JSON.stringify(data));
                    console.log("リセットコマンドを送信しました。");
                } else {
                    console.error("Reset用のWebSocket接続が開いていません。");
                }
            }
        }

    </script>
{% endblock %}
